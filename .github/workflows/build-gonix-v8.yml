name: GONIX 8 - Azul Noche
on:
  push:
    branches: [gonix-v8-azul-noche]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK de Android
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -f /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar proyecto original
        run: |
          mkdir gonix
          base64 -d gonix_v6_source.tar.xz.b64 > gonix-base.tar.xz
          tar -xJf gonix-base.tar.xz -C gonix
          cat v7-overlay-part{0,1,2,3}.txt | base64 -d > gonix-overlay.tar.xz
          echo "8cf736f8d87b2f183ec44b9033aef273162365785f4c3a026b79e80a85c18141  gonix-overlay.tar.xz" | sha256sum -c -
          tar -xJf gonix-overlay.tar.xz -C gonix
      - name: Aplicar nuevo diseño GONIX
        run: |
          base64 -d gonix_v8_style.py.xz.b64 > gonix-style.py.xz
          echo "7ba0c2ae5e8989923b44fe997e3e778e4f627a8c76cabb6d3b528b79486275a9  gonix-style.py.xz" | sha256sum -c -
          xz -d gonix-style.py.xz
          mv gonix-style.py gonix/style.py
          cd gonix
          python3 style.py
          grep -q "versionCode 8" app/build.gradle
      - name: Compilar APK Android
        working-directory: gonix
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GONIX-8-Azul-Noche-APK
          path: gonix/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
