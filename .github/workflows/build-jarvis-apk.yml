name: Jarvis Gratis APK
on:
  push:
    branches: [jarvis-gratis-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          ls -lah /usr/local/lib/android/sdk/platforms || true
          test -f /usr/local/lib/android/sdk/platforms/android-36/android.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack Jarvis source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,io,tarfile
          from pathlib import Path
          s=Path('jarvis_source.b64').read_text().strip()
          def check(candidate):
              try:
                  data=base64.b64decode(candidate,validate=True)
                  content=gzip.decompress(data)
                  with tarfile.open(fileobj=io.BytesIO(content)) as t:
                      names=t.getnames()
                  return data if 'app/src/main/java/cl/curico/jarvis/MainActivity.java' in names else None
              except Exception:
                  return None
          binary=check(s)
          if binary is None:
              for i in range(len(s)-1):
                  binary=check(s[:i]+s[i+2:])
                  if binary:
                      print('Recovered upload from two extra characters at index',i)
                      break
          if binary is None:
              raise RuntimeError('Could not validate uploaded Jarvis source tarball')
          Path('jarvis.tar.gz').write_bytes(binary)
          PY
          mkdir -p jarvis
          tar -xzf jarvis.tar.gz -C jarvis
      - name: Compile Jarvis APK
        working-directory: jarvis
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisGratis-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
