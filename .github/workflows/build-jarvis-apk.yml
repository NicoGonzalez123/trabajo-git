name: Jarvis Gratis APK
on:
  push:
    branches: [jarvis-gratis-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unpack Jarvis source
        run: |
          base64 -d jarvis_source.b64 > jarvis.tar.gz
          mkdir -p jarvis
          tar -xzf jarvis.tar.gz -C jarvis
      - name: Compile Jarvis APK
        working-directory: jarvis
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisGratis-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
