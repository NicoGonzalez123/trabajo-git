name = "gonix-llamadas-prueba"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
CALLS_ENABLED = "false"

# Crea en el panel Cloudflare una D1 llamada 'gonix-reminders' y pega el ID real aqui.
[[d1_databases]]
binding = "DB"
database_name = "gonix-reminders"
database_id = "00000000-0000-0000-0000-000000000000"
